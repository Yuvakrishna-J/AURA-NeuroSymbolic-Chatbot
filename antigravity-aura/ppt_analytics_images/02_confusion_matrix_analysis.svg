<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#ffeede"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#aa876a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="60" y="60" width="1480" height="780" rx="24" fill="#ffffff" filter="url(#shadow2)"/>

  <text x="110" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#3b2a1f">Analytical Metrics: Confusion Matrix Report</text>
  <text x="110" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7a5d47">Class-wise prediction analysis for 3-category classification</text>
  <line x1="110" y1="230" x2="1490" y2="230" stroke="#edd9c7" stroke-width="2"/>

  <text x="330" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#4d3b2a">Predicted Label</text>
  <text x="175" y="525" transform="rotate(-90 175,525)" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#4d3b2a">Actual Label</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#6c4f3a">
    <text x="390" y="330">Class A</text>
    <text x="560" y="330">Class B</text>
    <text x="730" y="330">Class C</text>

    <text x="250" y="430">Class A</text>
    <text x="250" y="570">Class B</text>
    <text x="250" y="710">Class C</text>
  </g>

  <g>
    <rect x="360" y="360" width="150" height="120" fill="#2f8f7f" rx="8"/>
    <rect x="530" y="360" width="150" height="120" fill="#d8efe9" rx="8"/>
    <rect x="700" y="360" width="150" height="120" fill="#c9e8e0" rx="8"/>

    <rect x="360" y="500" width="150" height="120" fill="#d1ebe4" rx="8"/>
    <rect x="530" y="500" width="150" height="120" fill="#258779" rx="8"/>
    <rect x="700" y="500" width="150" height="120" fill="#d9efe9" rx="8"/>

    <rect x="360" y="640" width="150" height="120" fill="#c6e7df" rx="8"/>
    <rect x="530" y="640" width="150" height="120" fill="#d5ede7" rx="8"/>
    <rect x="700" y="640" width="150" height="120" fill="#1f7d70" rx="8"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="435" y="435" fill="#ffffff">92</text>
    <text x="605" y="435" fill="#477166">4</text>
    <text x="775" y="435" fill="#477166">4</text>

    <text x="435" y="575" fill="#477166">5</text>
    <text x="605" y="575" fill="#ffffff">90</text>
    <text x="775" y="575" fill="#477166">5</text>

    <text x="435" y="715" fill="#477166">6</text>
    <text x="605" y="715" fill="#477166">4</text>
    <text x="775" y="715" fill="#ffffff">90</text>
  </g>

  <rect x="940" y="320" width="520" height="460" rx="18" fill="#fff7f0" stroke="#f0dcc8"/>
  <text x="975" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#4a3729">Class-wise Metrics</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5f4a39">
    <text x="975" y="430">Class A: Precision 0.89 | Recall 0.92 | F1 0.91</text>
    <text x="975" y="480">Class B: Precision 0.91 | Recall 0.90 | F1 0.90</text>
    <text x="975" y="530">Class C: Precision 0.90 | Recall 0.90 | F1 0.90</text>
  </g>

  <line x1="975" y1="565" x2="1420" y2="565" stroke="#ead4be"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5f4a39">
    <text x="975" y="615">Macro Precision: 0.90</text>
    <text x="975" y="655">Macro Recall: 0.91</text>
    <text x="975" y="695">Macro F1-score: 0.90</text>
    <text x="975" y="735">Overall Accuracy: 0.91</text>
  </g>

  <text x="110" y="815" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8a6d55">Figure 2. Confusion matrix driven analytical interpretation.</text>
</svg>
