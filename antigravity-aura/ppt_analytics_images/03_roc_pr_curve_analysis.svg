<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fff8"/>
      <stop offset="100%" stop-color="#e8f7ed"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#7da287" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>
  <rect x="60" y="60" width="1480" height="780" rx="24" fill="#ffffff" filter="url(#shadow3)"/>

  <text x="110" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#1f3a2a">Analytical Metrics: ROC and Precision-Recall Curves</text>
  <text x="110" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#4f6f5d">Threshold behavior and discriminative capacity of the final model</text>
  <line x1="110" y1="230" x2="1490" y2="230" stroke="#d2e5d8" stroke-width="2"/>

  <text x="250" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#2b4b3a">ROC Curve</text>
  <rect x="150" y="320" width="550" height="430" fill="#f7fcf8" stroke="#d8eadf"/>

  <line x1="200" y1="700" x2="650" y2="350" stroke="#b5cbbd" stroke-width="3" stroke-dasharray="8,8"/>
  <polyline fill="none" stroke="#2d8f6f" stroke-width="6" points="200,700 230,620 270,560 320,500 390,450 470,405 560,370 650,350"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#557062">
    <text x="185" y="730">0.0</text>
    <text x="635" y="730">1.0</text>
    <text x="120" y="705">0.0</text>
    <text x="120" y="355">1.0</text>
    <text x="365" y="780">False Positive Rate</text>
    <text x="50" y="560" transform="rotate(-90 50,560)">True Positive Rate</text>
  </g>

  <text x="220" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f6b51">AUC = 0.94</text>

  <text x="900" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#2b4b3a">Precision-Recall Curve</text>
  <rect x="800" y="320" width="550" height="430" fill="#f7fcf8" stroke="#d8eadf"/>

  <polyline fill="none" stroke="#e07b39" stroke-width="6" points="850,700 900,600 960,540 1030,500 1110,465 1210,430 1300,410"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#557062">
    <text x="835" y="730">0.0</text>
    <text x="1285" y="730">1.0</text>
    <text x="770" y="705">0.0</text>
    <text x="770" y="355">1.0</text>
    <text x="1040" y="780">Recall</text>
    <text x="710" y="560" transform="rotate(-90 710,560)">Precision</text>
  </g>

  <text x="870" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#a85624">AP = 0.92</text>

  <rect x="620" y="780" width="360" height="38" rx="8" fill="#edf7f0" stroke="#d2e5d8"/>
  <text x="640" y="806" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#345646">Better upper-left ROC and higher PR area indicate stronger classifier quality.</text>
</svg>
